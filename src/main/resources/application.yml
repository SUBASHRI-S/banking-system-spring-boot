server:
  port: ${PORT:8080}

spring:
  application:
    name: banksim
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:bank}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema comes from Flyway migrations only
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}      # no default on purpose: startup fails if missing or shorter than 32 chars
    expiry-seconds: 900
  transfer:
    daily-limit: ${DAILY_TRANSFER_LIMIT:100000.00}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@example.com}
    admin-password: ${SEED_ADMIN_PASSWORD:}   # blank = do not create an admin
