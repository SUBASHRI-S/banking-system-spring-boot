# Render Blueprint: New > Blueprint > pick this repo.
# Database: use a free Neon Postgres (Render's own free Postgres expires after 30 days).
# Re-check Render and Neon free-tier limits before you rely on them (see docs/DESIGN.md section 12.5).
services:
  - type: web
    name: banksim
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL            # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD   # set it if you want an admin user for the freeze demo
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
